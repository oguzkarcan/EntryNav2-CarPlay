name: Compatibility report
description: Share probe and test results for a BMW vehicle / head unit variant
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Use the read-only probe (`scripts/probe/car_visit.sh`) and `carplayd --compat` steps in [README.md](https://github.com/oguzkarcan/EntryNav2-CarPlay#collecting-logs-for-a-bug-report) and [docs/CAR_VISIT.md](https://github.com/oguzkarcan/EntryNav2-CarPlay/blob/main/docs/CAR_VISIT.md).
        Please redact any VIN, MAC addresses, phone name, serials, UDID/IMEI, accessory identity UUID, and non-`169.254.x.x` IPs before submitting.
  - type: input
    id: car
    attributes:
      label: Car model and year
      placeholder: 2018 BMW F30 320i
    validations:
      required: true
  - type: input
    id: head_unit
    attributes:
      label: Head unit variant and `/etc/version`
      description: Head unit hardware/variant and the contents of `/etc/version`.
      placeholder: HU_ENTRYNAV2, 202402191339
    validations:
      required: true
  - type: textarea
    id: compat_output
    attributes:
      label: "`carplayd --compat` output"
      description: Full output of `LD_LIBRARY_PATH=/usr/local/lib:/opt/hmi/lib:/usr/lib:/lib XDG_RUNTIME_DIR=/run/system/0 WAYLAND_DISPLAY=wayland-0 carplayd --compat`.
      render: text
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "`car_visit.sh` `SUMMARY.txt`"
      description: Paste the contents of `SUMMARY.txt` from your `car_visit.sh` run.
      render: text
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What works and what does not
      description: Note safe-mode menu behavior, MFi I2C (`--compat-mfi-read` if run safely), wired USB, wireless, audio, touch, and `ZBE3` controller behavior.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirmed no VIN, MAC addresses, phone name, serial numbers, UDID/IMEI, accessory identity UUID, or non-`169.254.x.x` IP addresses are included.
          required: true
